name: kartturi
description: 'A Flutter map application using NLS Finland vector tiles.'
publish_to: 'none'
version: 1.0.0+1

environment:
    sdk: ^3.12.1

dependencies:
    flutter:
        sdk: flutter
    cupertino_icons: ^1.0.8
    geolocator: ^13.0.2
    permission_handler: ^11.3.1
    maplibre: ^0.3.5
    flutter_compass: ^0.8.1

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^6.0.0

flutter:
    uses-material-design: true
    assets:
        - assets/style.json
        - assets/sprites/
